<script>

 function changeColor(element, color) {
        // Get the base data attribute from the parent element
        let base = element.parentElement.getAttribute('data-base');

        // Switch statement to change image based on color
        let newSrc;
        switch (color) {
            case '#151B54':
                newSrc = `images/dress/d5-blue.jpg`;
                break;
            case 'black':
                newSrc = `images/dress/d5-black.jpg`;
                break;
            case '#1b5e20':
                newSrc = `images/dress/d6-black.jpg`;
                break;
            case 'pink':
                newSrc = `images/dress/d6-pink.jpg`;
                break;
            case 'red':
                newSrc = `images/dress/d6-red.jpg`;
                break;
            case '#90caf9':
                newSrc = `images/dress/d6-blue.jpg`;
                break;
            case '#212121':
                newSrc = `images/dress/d1-dark.jpg`;
                break;
            case '#fff':
                newSrc = `images/dress/d1.jpg`;
                break;
            case '#bf360c':
                newSrc = `images/dress/d1-red.jpg`;
                break;
            case '#747170':
                newSrc = `images/dress/d7-silver.jpg`;
                break;
            case '#01579b':
                newSrc = `images/dress/d7-blue.jpg`;
                break;
            case '#C48793':
                newSrc = `images/dress/d7-pink.jpg`;
                break;
            case '#800517':
                newSrc = `images/dress/d7-red.jpg`;
                break;
            case '#b71c1c':
                newSrc = `images/dress/d8-red.jpg`;
                break;
            case '#00bfa5':
                newSrc = `images/dress/d8-green.jpg`;
                break;
			case '#757575':
                newSrc = `images/dress/d8-silver.jpg`;
                break;
				
			case 'rgb(255, 171, 145)':
                newSrc = `images/dress/d12.jpg`;
                break;
			
			case '#263238':
                newSrc = `images/dress/d12-black.jpg`;
                break;
			
			case '#00acc1':
                newSrc = `images/dress/d12-blue.jpg`;
                break;
			case '#9e9e9e':
                newSrc = `images/dress/d12-silver.jpg`;
                break;
			case '#254117':
                newSrc = `images/dress/d12-oil.webp`;
                break;
            case '#FAAFBE':
                newSrc = `images/dress/d11-pink.jpg`;
                break; 
            case '#dd2c00':
                newSrc = `images/dress/d11-red.jpg`;
                break;
             case '#461B7E':
                newSrc = `images/dress/d11-blue.jpg`;
                break;
              case '#424242':
                newSrc = `images/dress/d11-black.jpg`;
                break;
			
            default:
                newSrc = `images/dress/${base}.jpg`;
        }

        // Find the corresponding image element and update its src attribute
        let imgElement = element.parentElement.parentElement.querySelector('img');
        if (imgElement) {
            imgElement.src = newSrc;
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        const buyButtons = document.querySelectorAll('.buy-button2');

        buyButtons.forEach(button => {
            button.addEventListener('click', function(event) {
                event.preventDefault();

                // Check if a size is selected
                const selectedSize = this.closest('.item1').querySelector('input[type="radio"]:checked');

                if (selectedSize) {
                    // Show the modal for user information
                    const modal = document.getElementById('myModal');
                    modal.style.display = 'block';

                    // Close modal functionality
                    const closeBtn = modal.querySelector('.close');
                    closeBtn.addEventListener('click', function() {
                        modal.style.display = 'none';
                    });

                    // Close modal if user clicks outside of it
                    window.onclick = function(event) {
                        if (event.target == modal) {
                            modal.style.display = 'none';
                        }
                    };

                    // Handle form submission
                    const userInfoForm = modal.querySelector('#userInfoForm');
                    userInfoForm.addEventListener('submit', function(e) {
                        e.preventDefault();

                        // Collect user information
                        const email = document.getElementById('email').value;
                        const password = document.getElementById('password').value;
                        const username = document.getElementById('username').value;
                        const phone = document.getElementById('phone').value;
                        const location = document.getElementById('location').value;

                        // Example: Output collected information to console
                        console.log('Email:', email);
                        console.log('Password:', password);
                        console.log('Username:', username);
                        console.log('Phone:', phone);
                        console.log('Location:', location);

                        // Close the modal after submission
                        modal.style.display = 'none';
                    });
                } else {
                    // Inform user to select a size
                    alert('Please select a size before proceeding to purchase.');
                }
            });
        });
    });
</script>
